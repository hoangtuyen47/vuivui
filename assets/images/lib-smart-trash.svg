<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-trash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-trash)"/>

  <!-- Trash Bin Body -->
  <g transform="translate(120, 60)">
    <!-- Base -->
    <path d="M 20 90 L 140 90 L 130 240 L 30 240 Z" fill="#15803d" stroke="#22c55e" stroke-width="2.5"/>
    <!-- Recycle Icon -->
    <circle cx="80" cy="160" r="28" fill="#166534"/>
    <text x="80" y="167" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">♻</text>
    
    <!-- Open Lid Rotated (Servo actuated) -->
    <g transform="translate(15, 80) rotate(-40)">
      <rect x="0" y="0" width="130" height="18" rx="6" fill="#166534" stroke="#86efac" stroke-width="2"/>
      <rect x="50" y="-12" width="30" height="12" rx="4" fill="#15803d"/>
    </g>

    <!-- Ultrasonic Sensor HC-SR04 on top -->
    <rect x="35" y="55" width="90" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="55" cy="70" r="10" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="105" cy="70" r="10" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Ultrasonic Waves -->
    <path d="M 55 45 A 25 25 0 0 1 105 45" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
    <path d="M 45 35 A 40 40 0 0 1 115 35" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  </g>

  <!-- Approaching Hand Illustration -->
  <g transform="translate(200, 25)">
    <path d="M 30 15 C 30 5, 45 5, 45 25 L 45 50 C 45 60, 20 60, 20 50 Z" fill="#fed7aa"/>
    <text x="85" y="45" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="bold" fill="#fed7aa">Khoảng cách &lt; 20cm</text>
  </g>

  <!-- Servo & Board Info on Right -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="240" height="180" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="#22c55e" stroke-width="2"/>
    <text x="120" y="35" font-family="'Be Vietnam Pro', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">CƠ CHẾ HOẠT ĐỘNG</text>
    
    <text x="20" y="70" font-family="sans-serif" font-size="12" fill="#86efac">1. HC-SR04 phát sóng siêu âm</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#86efac">2. Phát hiện tay dưới 20cm</text>
    <text x="20" y="120" font-family="sans-serif" font-size="12" fill="#86efac">3. Động cơ Servo quay 90° mở nắp</text>
    <text x="20" y="145" font-family="sans-serif" font-size="12" fill="#fde047">4. Tự động đóng nắp sau 3 giây</text>
  </g>
</svg>