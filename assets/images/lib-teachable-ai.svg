<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#ai-bg)"/>

  <!-- Camera Vision Box -->
  <rect x="40" y="45" width="170" height="145" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <!-- Target Reticle -->
  <circle cx="125" cy="115" r="35" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 125,90 L 125,80 M 125,140 L 125,150 M 90,115 L 80,115 M 160,115 L 170,115" stroke="#34d399" stroke-width="2"/>
  
  <!-- Plastic bottle wireframe -->
  <rect x="115" y="95" width="20" height="40" rx="3" fill="#38bdf8" opacity="0.8"/>
  <rect x="120" y="90" width="10" height="5" fill="#facc15"/>

  <!-- AI Confidence Bars on Right -->
  <g transform="translate(230, 55)">
    <!-- Class 1: Rác Nhựa (98%) -->
    <text x="0" y="12" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">NHỰA (Plastic)</text>
    <text x="135" y="12" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#10b981">98%</text>
    <rect x="0" y="18" width="135" height="10" rx="5" fill="#1e293b"/>
    <rect x="0" y="18" width="132" height="10" rx="5" fill="#10b981"/>

    <!-- Class 2: Giấy (Paper) -->
    <text x="0" y="52" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">GIẤY (Paper)</text>
    <text x="135" y="52" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#64748b">1%</text>
    <rect x="0" y="58" width="135" height="10" rx="5" fill="#1e293b"/>
    <rect x="0" y="58" width="3" height="10" rx="5" fill="#64748b"/>

    <!-- Class 3: Kim loại (Metal) -->
    <text x="0" y="92" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">KIM LOẠI (Metal)</text>
    <text x="135" y="92" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" fill="#64748b">1%</text>
    <rect x="0" y="98" width="135" height="10" rx="5" fill="#1e293b"/>
    <rect x="0" y="98" width="3" height="10" rx="5" fill="#64748b"/>
  </g>

  <!-- Badge label -->
  <rect x="20" y="14" width="220" height="24" rx="12" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="130" y="30" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">AI TEACHABLE MACHINE</text>
</svg>