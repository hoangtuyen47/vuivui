<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-circuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-circuit)"/>
  
  <rect x="40" y="40" width="720" height="370" rx="16" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="70" y="80" fill="#f5d061" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold">SƠ ĐỒ NỐI DÂY THỰC HÀNH: ARDUINO UNO + CẢM BIẾN SIÊU ÂM + LCD I2C</text>

  <rect x="70" y="120" width="210" height="250" rx="12" fill="#00878F" stroke="#00e5ff" stroke-width="2"/>
  <text x="175" y="155" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ARDUINO UNO R3</text>
  <text x="90" y="190" fill="#ffffff" font-size="12" font-family="monospace">5V      ─── Dây Đỏ (VCC)</text>
  <text x="90" y="215" fill="#ffffff" font-size="12" font-family="monospace">GND     ─── Dây Đen (GND)</text>
  <text x="90" y="240" fill="#ffffff" font-size="12" font-family="monospace">Pin 9   ─── Trig Pin</text>
  <text x="90" y="265" fill="#ffffff" font-size="12" font-family="monospace">Pin 10  ─── Echo Pin</text>
  <text x="90" y="290" fill="#ffffff" font-size="12" font-family="monospace">Pin A4  ─── I2C SDA</text>
  <text x="90" y="315" fill="#ffffff" font-size="12" font-family="monospace">Pin A5  ─── I2C SCL</text>

  <rect x="330" y="120" width="180" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="380" cy="185" r="28" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="460" cy="185" r="28" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>
  <text x="420" y="145" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HC-SR04 ULTRASONIC</text>

  <rect x="550" y="120" width="180" height="250" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="565" y="140" width="150" height="90" rx="6" fill="#022c22" stroke="#34d399"/>
  <text x="640" y="180" fill="#34d399" font-family="monospace" font-size="12" text-anchor="middle">Distance: 32 cm</text>
  <text x="640" y="205" fill="#34d399" font-family="monospace" font-size="12" text-anchor="middle">Buzzer: SAFE</text>
  <text x="640" y="275" fill="#a7f3d0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Màn hình LCD 1602 I2C</text>
  <text x="640" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Địa chỉ I2C: 0x27 / 0x3F</text>
  <text x="640" y="325" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle">Chỉ cần 4 chân nối</text>

