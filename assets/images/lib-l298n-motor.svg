<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="l298n-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="heatsink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#l298n-bg)"/>
  
  <!-- Red PCB Board -->
  <rect x="40" y="30" width="320" height="180" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="3"/>
  
  <!-- Large Black Heatsink -->
  <rect x="130" y="50" width="140" height="90" rx="4" fill="url(#heatsink)" stroke="#475569" stroke-width="2"/>
  <!-- Heatsink fins -->
  <line x1="150" y1="50" x2="150" y2="140" stroke="#0f172a" stroke-width="4"/>
  <line x1="170" y1="50" x2="170" y2="140" stroke="#0f172a" stroke-width="4"/>
  <line x1="190" y1="50" x2="190" y2="140" stroke="#0f172a" stroke-width="4"/>
  <line x1="210" y1="50" x2="210" y2="140" stroke="#0f172a" stroke-width="4"/>
  <line x1="230" y1="50" x2="230" y2="140" stroke="#0f172a" stroke-width="4"/>
  <line x1="250" y1="50" x2="250" y2="140" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Screw Terminals (Blue) -->
  <!-- Power Terminal -->
  <rect x="55" y="150" width="50" height="45" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <circle cx="70" cy="172" r="6" fill="#38bdf8"/>
  <circle cx="90" cy="172" r="6" fill="#38bdf8"/>
  <text x="80" y="142" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">VIN / GND</text>

  <!-- Motor Out Terminals -->
  <rect x="295" y="70" width="50" height="40" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <circle cx="310" cy="90" r="5" fill="#38bdf8"/>
  <circle cx="330" cy="90" r="5" fill="#38bdf8"/>
  <text x="320" y="62" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">OUT 1-2</text>

  <!-- Control Header Pins (ENA, IN1, IN2, IN3, IN4, ENB) -->
  <rect x="135" y="160" width="130" height="25" rx="2" fill="#0f172a"/>
  <g fill="#facc15">
    <rect x="145" y="165" width="4" height="15"/>
    <rect x="165" y="165" width="4" height="15"/>
    <rect x="185" y="165" width="4" height="15"/>
    <rect x="205" y="165" width="4" height="15"/>
    <rect x="225" y="165" width="4" height="15"/>
    <rect x="245" y="165" width="4" height="15"/>
  </g>
  <text x="200" y="200" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">PWM SPEED CONTROL (IN1 - IN4)</text>

  <!-- Badge label -->
  <rect x="20" y="12" width="160" height="24" rx="12" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="100" y="28" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">CẦU H ĐỘNG CƠ L298N</text>
</svg>