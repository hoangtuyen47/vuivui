<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-traffic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow-red"><feGaussianBlur stdDeviation="6" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glow-yel"><feGaussianBlur stdDeviation="6" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="glow-grn"><feGaussianBlur stdDeviation="6" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  </defs>
  <rect width="600" height="350" fill="url(#bg-traffic)"/>
  
  <!-- Road lines -->
  <line x1="0" y1="310" x2="600" y2="310" stroke="#334155" stroke-width="3"/>
  <line x1="50" y1="310" x2="120" y2="310" stroke="#ffffff" stroke-width="8"/>
  <line x1="160" y1="310" x2="230" y2="310" stroke="#ffffff" stroke-width="8"/>
  <line x1="270" y1="310" x2="340" y2="310" stroke="#ffffff" stroke-width="8"/>
  <line x1="380" y1="310" x2="450" y2="310" stroke="#ffffff" stroke-width="8"/>

  <!-- Traffic Light Pole -->
  <rect x="220" y="240" width="16" height="80" fill="#475569"/>
  <!-- Light Box -->
  <rect x="185" y="40" width="86" height="205" rx="16" fill="#020617" stroke="#334155" stroke-width="3"/>
  <!-- Lights -->
  <circle cx="228" cy="80" r="24" fill="#ef4444" filter="url(#glow-red)"/>
  <circle cx="228" cy="142" r="24" fill="#eab308" filter="url(#glow-yel)"/>
  <circle cx="228" cy="204" r="24" fill="#22c55e" filter="url(#glow-grn)"/>

  <!-- Arduino Board Mini -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="#00878F" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="40" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">ARDUINO UNO R3</text>
    <rect x="30" y="60" width="80" height="30" rx="4" fill="#1e293b"/>
    <text x="70" y="80" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">ATmega328P</text>
    <!-- Push Button -->
    <rect x="130" y="60" width="45" height="45" rx="6" fill="#dc2626"/>
    <circle cx="152" cy="82" r="14" fill="#f87171"/>
    <text x="110" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">NÚT BẤM ƯU TIÊN</text>
  </g>

  <!-- Wires -->
  <path d="M 271 80 C 290 80, 300 110, 320 110" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  <path d="M 271 142 C 290 142, 300 120, 320 120" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <path d="M 271 204 C 290 204, 300 130, 320 130" stroke="#10b981" stroke-width="2.5" fill="none"/>

  <rect x="290" y="235" width="270" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="425" y="260" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    DỰ ÁN: ĐÈN GIAO THÔNG THÔNG MINH
  </text>
</svg>