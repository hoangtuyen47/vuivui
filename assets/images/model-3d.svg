<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0d1627"/>
      <stop offset="100%" stop-color="#081d2e"/>
    </linearGradient>
    <linearGradient id="arduino-board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878F"/>
      <stop offset="50%" stop-color="#006d73"/>
      <stop offset="100%" stop-color="#004a4e"/>
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow3d" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-3d)"/>
  <circle cx="400" cy="225" r="200" fill="#00878F" opacity="0.15" filter="url(#glow3d)"/>

  <g opacity="0.2" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="380" x2="700" y2="380"/>
    <line x1="150" y1="340" x2="650" y2="340"/>
    <line x1="200" y1="300" x2="600" y2="300"/>
    <line x1="250" y1="300" x2="100" y2="380"/>
    <line x1="350" y1="300" x2="280" y2="380"/>
    <line x1="450" y1="300" x2="480" y2="380"/>
    <line x1="550" y1="300" x2="680" y2="380"/>
  </g>

  <g transform="translate(180, 80)">
    <rect x="0" y="0" width="440" height="280" rx="24" fill="url(#arduino-board)" stroke="#00e5ff" stroke-width="2.5" filter="drop-shadow(0 25px 40px rgba(0,0,0,0.8))"/>
    
    <rect x="-25" y="35" width="65" height="60" rx="6" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="-22" y="45" width="12" height="40" fill="#475569"/>
    
    <rect x="-25" y="180" width="75" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="-2" cy="207" r="12" fill="#334155"/>

    <rect x="170" y="110" width="160" height="65" rx="6" fill="url(#chip-grad)" stroke="#475569" stroke-width="1.5"/>
    <text x="250" y="148" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">ATmega328P</text>
    
    <rect x="120" y="15" width="280" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
    <rect x="150" y="247" width="250" height="18" rx="4" fill="#0f172a" stroke="#334155"/>

    <circle cx="140" cy="90" r="6" fill="#22c55e" filter="url(#glow3d)"/>
    <text x="155" y="94" fill="#86efac" font-family="sans-serif" font-size="10" font-weight="bold">ON</text>

    <circle cx="140" cy="120" r="6" fill="#f59e0b" filter="url(#glow3d)"/>
    <text x="155" y="124" fill="#fde047" font-family="sans-serif" font-size="10" font-weight="bold">TX / RX</text>

    <text x="260" y="80" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" letter-spacing="2">ARDUINO UNO</text>
    <text x="260" y="215" fill="#80e0e5" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="1">MÔ PHỎNG 3D WEBGL</text>

    <ellipse cx="220" cy="140" rx="240" ry="100" fill="none" stroke="#f5d061" stroke-width="2" stroke-dasharray="8 8" opacity="0.75" transform="rotate(-15 220 140)"/>
    <circle cx="420" cy="90" r="12" fill="#f5d061" filter="url(#glow3d)"/>
  </g>
