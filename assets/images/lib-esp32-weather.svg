<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-weather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-weather)"/>

  <!-- Left: ESP32 + DHT11 Sensor -->
  <g transform="translate(80, 55)">
    <!-- ESP32 Board -->
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <rect x="40" y="40" width="100" height="110" rx="6" fill="#475569"/>
    <text x="90" y="95" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ESP32 SoC</text>
    <text x="90" y="120" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Wi-Fi + BLE</text>

    <!-- DHT11 Sensor Module -->
    <g transform="translate(200, 20)">
      <rect x="0" y="0" width="90" height="100" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <!-- Grid holes on blue DHT11 -->
      <circle cx="25" cy="30" r="4" fill="#0369a1"/>
      <circle cx="45" cy="30" r="4" fill="#0369a1"/>
      <circle cx="65" cy="30" r="4" fill="#0369a1"/>
      <circle cx="25" cy="50" r="4" fill="#0369a1"/>
      <circle cx="45" cy="50" r="4" fill="#0369a1"/>
      <circle cx="65" cy="50" r="4" fill="#0369a1"/>
      <text x="45" y="85" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">DHT11</text>
    </g>

    <!-- Wire connection -->
    <path d="M 180 80 L 200 80" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- Right: OLED Screen Displaying Real-time data -->
  <g transform="translate(390, 75)">
    <!-- OLED Module Frame -->
    <rect x="0" y="0" width="160" height="190" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <!-- Screen -->
    <rect x="15" y="20" width="130" height="100" rx="4" fill="#000000" stroke="#1e293b"/>
    <text x="80" y="45" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">WEATHER STATION</text>
    <text x="80" y="75" font-family="monospace" font-size="16" font-weight="900" fill="#facc15" text-anchor="middle">28.5 °C</text>
    <text x="80" y="105" font-family="monospace" font-size="15" font-weight="900" fill="#38bdf8" text-anchor="middle">HUM: 68%</text>

    <!-- Wi-Fi Status Indicator -->
    <rect x="25" y="140" width="110" height="28" rx="6" fill="#047857"/>
    <text x="80" y="158" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">WI-FI ONLINE</text>
  </g>
</svg>