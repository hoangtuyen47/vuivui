    <rect x="30" y="60" width="360" height="45" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="55" cy="82" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M50 82 L54 86 L61 78" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="80" y="80" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Phụ lục 1: Phân phối chương trình Tin 10, 11, 12</text>
    <text x="80" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11">Đã ký duyệt điện tử • Đồng bộ Google Drive</text>

