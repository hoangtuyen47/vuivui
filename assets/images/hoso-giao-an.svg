    <rect x="25" y="175" width="150" height="36" rx="10" fill="url(#cyan-grad)"/>
    <text x="100" y="198" fill="#070b14" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Chuẩn BGD&amp;ĐT</text>
