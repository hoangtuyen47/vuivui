  <g transform="translate(540, 90)">
    <rect width="200" height="250" rx="20" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(245, 208, 97, 0.3)" stroke-width="1.5" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.6))"/>
