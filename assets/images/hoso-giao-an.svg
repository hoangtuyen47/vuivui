    <circle cx="55" cy="142" r="14" fill="#0ea5e9" opacity="0.2"/>
    <path d="M50 142 L54 146 L61 138" stroke="#0ea5e9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="80" y="140" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Phụ lục 2: Kế hoạch tổ chức hoạt động giáo dục</text>
    <text x="80" y="155" fill="#94a3b8" font-family="sans-serif" font-size="11">Chuyên đề STEM &amp; Lập trình ứng dụng AI</text>

