<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="inner-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Outer red ring -->
  <circle cx="120" cy="120" r="115" fill="#ffffff" stroke="url(#logo-border)" stroke-width="8"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#dc2626" stroke-width="2"/>
  
  <!-- Text in ring -->
  <path id="text-path-top" d="M 30,120 A 90,90 0 0,1 210,120" fill="none"/>
  <text font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="11" font-weight="900" fill="#b91c1c" letter-spacing="1.5">
    <textPath href="#text-path-top" startOffset="50%" text-anchor="middle">
      TRƯỜNG THPT EA H'LEO
    </textPath>
  </text>
  
  <path id="text-path-bottom" d="M 210,120 A 90,90 0 0,1 30,120" fill="none"/>
  <text font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c" letter-spacing="2">
    <textPath href="#text-path-bottom" startOffset="50%" text-anchor="middle">
      ĐẮK LẮK • 2026 - 2027
    </textPath>
  </text>

  <!-- Inner Blue Crest -->
  <circle cx="120" cy="120" r="76" fill="url(#inner-blue)"/>
  
  <!-- Open Book Symbol -->
  <path d="M 120,135 Q 100,122 75,125 Q 75,150 120,160 Q 165,150 165,125 Q 140,122 120,135 Z" fill="#ffffff"/>
  <path d="M 120,135 L 120,160" stroke="#0284c7" stroke-width="2"/>
  <line x1="82" y1="133" x2="114" y2="138" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="82" y1="140" x2="114" y2="145" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="126" y1="138" x2="158" y2="133" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="126" y1="145" x2="158" y2="140" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Flaming Torch of Knowledge -->
  <polygon points="120,72 114,106 126,106" fill="#facc15" stroke="#eab308" stroke-width="1"/>
  <!-- Flames -->
  <path d="M 120,62 Q 130,75 125,90 Q 120,82 118,92 Q 112,80 120,62 Z" fill="#ef4444"/>
  <path d="M 120,68 Q 125,78 122,86 Q 119,80 120,68 Z" fill="#fbbf24"/>
  <!-- Letter GD -->
  <text x="120" y="117" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">G &amp; D</text>
</svg>