  <text x="65" y="90" font-family="monospace" font-size="12" fill="#a5b4fc">FPS: 30.0 • CONFIDENCE: 98.4%</text>

  <!-- Hand Skeleton Tracking (MediaPipe 21 Landmarks) -->
