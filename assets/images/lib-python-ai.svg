      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bg-py)"/>

  <!-- Webcam Viewport Frame -->
  <rect x="40" y="30" width="520" height="290" rx="16" fill="#020617" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Camera HUD Elements -->
