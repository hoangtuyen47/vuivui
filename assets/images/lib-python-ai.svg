    <!-- Wrist -->
    <circle cx="120" cy="220" r="7" fill="#ef4444"/>
    
    <!-- Thumb -->
    <line x1="120" y1="220" x2="80" y2="190" stroke="#22c55e" stroke-width="3"/>
