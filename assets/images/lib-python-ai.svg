    <line x1="100" y1="160" x2="90" y2="110" stroke="#22c55e" stroke-width="3"/>
    <circle cx="90" cy="110" r="5" fill="#22c55e"/>
    <line x1="90" y1="110" x2="85" y2="60" stroke="#22c55e" stroke-width="3"/>
