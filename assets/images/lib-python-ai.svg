    <circle cx="130" cy="150" r="5" fill="#22c55e"/>
    <line x1="130" y1="150" x2="135" y2="100" stroke="#22c55e" stroke-width="3"/>
    <circle cx="135" cy="100" r="5" fill="#22c55e"/>
    <line x1="135" y1="100" x2="140" y2="50" stroke="#22c55e" stroke-width="3"/>
    <circle cx="140" cy="50" r="7" fill="#facc15"/>

    <!-- Ring Finger -->
    <line x1="120" y1="220" x2="160" y2="160" stroke="#22c55e" stroke-width="3"/>
    <circle cx="160" cy="160" r="5" fill="#22c55e"/>
    <line x1="160" y1="160" x2="175" y2="120" stroke="#22c55e" stroke-width="3"/>
    <circle cx="175" cy="120" r="5" fill="#22c55e"/>
    <line x1="175" y1="120" x2="185" y2="80" stroke="#22c55e" stroke-width="3"/>
    <circle cx="185" cy="80" r="7" fill="#facc15"/>

    <!-- Pinky Finger -->
    <line x1="120" y1="220" x2="190" y2="180" stroke="#22c55e" stroke-width="3"/>
    <circle cx="190" cy="180" r="5" fill="#22c55e"/>
    <line x1="190" y1="180" x2="210" y2="150" stroke="#22c55e" stroke-width="3"/>
    <circle cx="210" cy="150" r="5" fill="#22c55e"/>
    <line x1="210" y1="150" x2="225" y2="110" stroke="#22c55e" stroke-width="3"/>
    <circle cx="225" cy="110" r="7" fill="#facc15"/>

    <!-- Gesture Recognition Label -->
    <rect x="250" y="80" width="140" height="50" rx="8" fill="#15803d"/>
    <text x="320" y="105" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">VICTORY (V)</text>
    <text x="320" y="122" font-family="sans-serif" font-size="10" fill="#dcfce7" text-anchor="middle">2 Fingers Detected</text>
